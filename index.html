<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Calculator project for Odin project">
  <link rel="icon" type="favicon" href="assets/favicon.svg">
  <title>Odin: Calc</title>
</head>
<body>
  <div class="container">
    <input type="text" id="display" value="0" disabled>
    <div class="btn-grid">
      <button id="del-btn">Del</button>
      <button id="divide-btn">&divide</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button id="multiply-btn">x</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button id="sub-btn">-</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button id="add-btn">+</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button id="equal-btn">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
